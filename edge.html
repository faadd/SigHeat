<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SigHeat · Mobile Edge Node</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Paho MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

      body {
        background-color: #02040a;
        color: #cbd5e1;
        font-family: "Inter", sans-serif;
      }

      .bg-noise {
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .bg-grid-pattern {
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          );
        background-size: 24px 24px;
      }
    </style>
  </head>
  <body
    class="min-h-screen relative overflow-x-hidden selection:bg-amber-500/30 text-slate-300 pb-12"
  >
    <div class="fixed inset-0 bg-noise pointer-events-none z-0"></div>
    <div
      class="fixed top-[10%] left-[10%] w-[400px] h-[400px] bg-amber-500/10 rounded-full blur-[130px] pointer-events-none z-0"
    ></div>
    <div
      class="fixed bottom-[10%] right-[10%] w-[450px] h-[450px] bg-indigo-600/10 rounded-full blur-[140px] pointer-events-none z-0"
    ></div>
    <div
      class="fixed inset-0 bg-grid-pattern opacity-60 pointer-events-none z-0"
    ></div>

    <div class="max-w-md mx-auto px-4 pt-8 relative z-10">
      <!-- Header -->
      <header
        class="flex items-center gap-3 mb-6 pb-4 border-b border-white/10 glass-panel rounded-2xl px-6 py-4"
      >
        <div
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-200 to-amber-500 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-amber-500/20"
        >
          <i data-lucide="radio" class="w-6 h-6"></i>
        </div>
        <div>
          <h1
            class="text-lg font-bold tracking-tight text-white flex items-center gap-2"
          >
            Mobile Edge
            <span
              class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20"
              >Node Unit</span
            >
          </h1>
          <p class="text-xs text-slate-400">
            SigHeat Field Telemetry Transmitter
          </p>
        </div>
      </header>

      <!-- Control Card -->
      <div class="glass-panel rounded-3xl p-6 mb-6 shadow-xl space-y-4">
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1.5"
          >
            <i
              data-lucide="folder-git-2"
              class="w-3.5 h-3.5 text-amber-400"
            ></i>
            Project ID Kelompok
          </label>
          <input
            type="text"
            id="project-id"
            value="sigheat_kelompok_07"
            class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition-colors font-mono"
          />
        </div>

        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1.5"
          >
            <i data-lucide="cpu" class="w-3.5 h-3.5 text-amber-400"></i> Pilih
            Peran Perangkat
          </label>
          <!-- Perangkat select ini akan otomatis terkunci saat perangkat sedang berjalan -->
          <select
            id="device-role"
            class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <option value="node1" class="bg-slate-900 text-white">
              Edge 1 (HP Area A)
            </option>
            <option value="node2" class="bg-slate-900 text-white">
              Edge 2 (HP Area B)
            </option>
          </select>
        </div>

        <button
          id="main-btn"
          onclick="toggleTelemetry()"
          class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs tracking-wider uppercase transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2"
        >
          <i data-lucide="send" class="w-4 h-4"></i> Mulai Mengirim Telemetri
        </button>
      </div>

      <!-- Telemetry Status Card -->
      <div class="glass-panel rounded-3xl p-6 mb-6 space-y-4">
        <div class="flex justify-between items-center">
          <span
            class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5"
          >
            <i data-lucide="wifi" class="w-3.5 h-3.5 text-slate-400"></i> Status
            MQTT
          </span>
          <span
            id="mqtt-status"
            class="px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-rose-400 border border-rose-500/30"
            >Terputus</span
          >
        </div>

        <div
          class="flex justify-between items-center border-t border-white/5 pt-3"
        >
          <span
            class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5"
          >
            <i data-lucide="timer" class="w-3.5 h-3.5 text-slate-400"></i>
            Latensi RTT
          </span>
          <strong id="lbl-rtt" class="text-xl font-mono text-white"
            >-- ms</strong
          >
        </div>

        <div
          class="flex justify-between items-center border-t border-white/5 pt-3"
        >
          <span
            class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-1.5"
          >
            <i data-lucide="activity" class="w-3.5 h-3.5 text-slate-400"></i>
            Status Zona
          </span>
          <strong
            id="lbl-zone"
            class="text-xs font-semibold text-amber-400 tracking-wider"
            >--</strong
          >
        </div>
      </div>

      <!-- Log Aktivitas -->
      <div class="glass-panel rounded-3xl p-6">
        <label
          class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5"
        >
          <i data-lucide="terminal" class="w-3.5 h-3.5 text-amber-400"></i> Log
          Aktivitas
        </label>
        <div
          id="log"
          class="bg-slate-950/80 border border-white/5 rounded-2xl p-4 font-mono text-xs text-amber-300 h-36 overflow-y-auto space-y-1"
        >
          <div>> Menunggu start...</div>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();

      let isRunning = false;
      let client = null;
      let timer = null;
      let sequence = 0;
      let currentRtt = 0;
      let activeSenderId = null;
      let myUniqueId = "";

      function log(msg) {
        const box = document.getElementById("log");
        box.innerHTML += `<div>> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
      }

      async function measurePing() {
        const start = Date.now();
        try {
          await fetch("https://www.google.com/favicon.ico", {
            mode: "no-cors",
            cache: "no-store",
          });
          currentRtt = Date.now() - start;
        } catch (e) {
          currentRtt = 200;
        }
        document.getElementById("lbl-rtt").innerText = currentRtt + " ms";

        let zone = "GOOD_ZONE";
        if (currentRtt >= 80 && currentRtt < 180) zone = "MODERATE_ZONE";
        else if (currentRtt >= 180) zone = "DEAD_ZONE";
        document.getElementById("lbl-zone").innerText = zone;
        return { rtt: currentRtt, zone: zone };
      }

      function toggleTelemetry() {
        const btn = document.getElementById("main-btn");
        const roleSelect = document.getElementById("device-role");
        const projectId = document.getElementById("project-id").value;
        const role = roleSelect.value;

        if (!isRunning) {
          myUniqueId =
            "edge_" + role + "_" + Math.random().toString(16).substr(2, 6);
          activeSenderId = null;

          client = new Paho.MQTT.Client(
            "broker.hivemq.com",
            8884,
            "/mqtt",
            myUniqueId,
          );

          client.onConnectionLost = (responseObject) => {
            const statusEl = document.getElementById("mqtt-status");
            if (statusEl) {
              statusEl.className =
                "px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-rose-400 border border-rose-500/30";
              statusEl.innerText = "Terputus";
            }
            log("Koneksi terputus: " + responseObject.errorMessage);
            stopEverything();
          };

          client.onMessageArrived = (msg) => {
            try {
              const data = JSON.parse(msg.payloadString);
              if (data.client_id !== myUniqueId && data.status !== "OFFLINE") {
                activeSenderId = data.client_id;
              }
            } catch (e) {}
          };

          client.connect({
            useSSL: true,
            onSuccess: () => {
              log(`Memeriksa ketersediaan jalur untuk ${role}...`);
              const topic = `sigheat/${projectId}/edge/${role}/telemetry`;
              client.subscribe(topic);

              setTimeout(() => {
                if (activeSenderId !== null) {
                  alert(
                    `PERINGATAN: Peran ${role} sedang digunakan oleh perangkat lain (${activeSenderId})! Silakan pilih peran lain.`,
                  );
                  log(
                    `GAGAL: Peran ${role} sedang aktif digunakan oleh ${activeSenderId}.`,
                  );
                  try {
                    client.disconnect();
                  } catch (err) {}
                  stopEverything();
                  return;
                }

                // Jalur bersih: Kunci dropdown peran agar tidak bisa diubah saat berjalan
                roleSelect.disabled = true;

                const statusEl = document.getElementById("mqtt-status");
                statusEl.className =
                  "px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                statusEl.innerText = "Terhubung";
                isRunning = true;

                btn.className =
                  "w-full py-3.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs tracking-wider uppercase transition-all shadow-lg shadow-rose-500/20 flex items-center justify-center gap-2";
                btn.innerHTML = `<i data-lucide="square" class="w-4 h-4"></i> Hentikan Telemetri`;
                lucide.createIcons();

                log(`Berhasil mengamankan dan terhubung sebagai ${role}!`);

                timer = setInterval(async () => {
                  sequence++;
                  const metric = await measurePing();
                  const payload = {
                    client_id: myUniqueId,
                    device_id: role,
                    sequence: sequence,
                    smoothed_rtt_ms: metric.rtt,
                    status_zone: metric.zone,
                    status: "ONLINE",
                    timestamp: Date.now(),
                  };

                  const message = new Paho.MQTT.Message(
                    JSON.stringify(payload),
                  );
                  message.destinationName = topic;
                  client.send(message);
                  log(`Kirim #${sequence} (${role}) | RTT: ${metric.rtt}ms`);
                }, 2000);
              }, 2000);
            },
            onFailure: (err) => {
              log("Gagal konek: " + err.errorMessage);
              stopEverything();
            },
          });
        } else {
          // Kirim sinyal OFFLINE agar peran langsung terbuka kembali secara instan
          if (client && client.isConnected()) {
            try {
              const topic = `sigheat/${projectId}/edge/${role}/telemetry`;
              const offlinePayload = JSON.stringify({
                client_id: myUniqueId,
                device_id: role,
                status: "OFFLINE",
                timestamp: Date.now(),
              });
              const message = new Paho.MQTT.Message(offlinePayload);
              message.destinationName = topic;
              client.send(message);
              client.disconnect();
            } catch (e) {}
          }
          stopEverything();
          log("Telemetri dihentikan.");
        }
      }

      function stopEverything() {
        clearInterval(timer);
        timer = null;
        isRunning = false;
        activeSenderId = null;

        // Buka kembali kunci dropdown pilihan peran saat telemetri dihentikan
        const roleSelect = document.getElementById("device-role");
        if (roleSelect) {
          roleSelect.disabled = false;
        }

        const btn = document.getElementById("main-btn");
        if (btn) {
          btn.className =
            "w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs tracking-wider uppercase transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2";
          btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Mulai Mengirim Telemetri`;
          lucide.createIcons();
        }

        const statusEl = document.getElementById("mqtt-status");
        if (statusEl) {
          statusEl.className =
            "px-3 py-1 rounded-full text-xs font-bold bg-slate-800 text-rose-400 border border-rose-500/30";
          statusEl.innerText = "Terputus";
        }
      }
    </script>
  </body>
</html>
